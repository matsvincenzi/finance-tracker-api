name: finance-tracker

services:
    app:
        build:
            context: .
            target: app
        environment:
            APP_NAME: Finance Tracker API
            APP_ENV: production
            APP_DEBUG: "false"
            APP_KEY: ${APP_KEY:-}
            APP_URL: http://localhost:${APP_PORT:-8000}
            LOG_CHANNEL: stderr
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: finance_tracker
            DB_USERNAME: finance
            DB_PASSWORD: secret
            CACHE_STORE: database
            SESSION_DRIVER: array
            QUEUE_CONNECTION: sync
            FRANKFURTER_URL: ${FRANKFURTER_URL:-https://api.frankfurter.dev/v1}
            SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
            interval: 5s
            timeout: 3s
            retries: 30
        restart: unless-stopped

    web:
        build:
            context: .
            target: web
        ports:
            - "${APP_PORT:-8000}:80"
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/up || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: unless-stopped

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: finance_tracker
            MYSQL_USER: finance
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "127.0.0.1:${DB_FORWARD_PORT:-3316}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: unless-stopped

volumes:
    mysql-data:
